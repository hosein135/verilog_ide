[package]
name = "vcd-anon"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# `clock` is required for `chrono::Local` (not a default feature on recent chrono).
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3.23.0"
wellen = "0.20.1"
